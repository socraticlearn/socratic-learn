name: Python package release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require an exact version tag
        shell: python
        run: |
          import os
          import sys

          sys.path.insert(0, os.getcwd())
          from socratic_learn import __version__

          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/v"):
              expected = f"v{__version__}"
              actual = os.environ["GITHUB_REF_NAME"]
              if actual != expected:
                  raise SystemExit(
                      f"release tag {actual!r} does not match package {expected!r}"
                  )
          elif os.environ["GITHUB_EVENT_NAME"] != "workflow_dispatch":
              raise SystemExit(f"unsupported release ref: {ref}")

  python-package:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Build deterministic distribution
        run: python -m socratic_learn build
      - name: Run full unit suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate repository
        run: python tests/validate_repository.py
      - name: Build wheel and source distribution
        run: python -m build --outdir release-dist
      - name: Smoke test installed socratic read
        shell: python
        run: |
          import pathlib
          import sys

          root = pathlib.Path.cwd()
          sys.path.insert(0, str(root))
          # Gate: socratic read --agent pi minimal-text.pdf explain its evidence
          from tests.read_smoke import run_wheel_read_smoke

          run_wheel_read_smoke(root)
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: release-dist/*

  publish-github:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: python-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: release-assets/packages
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release-assets/packages/*
          --verify-tag
          --generate-notes

  publish-pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: python-package
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: release-dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-dist/
