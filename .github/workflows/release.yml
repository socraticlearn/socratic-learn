name: Python package release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require an exact version tag
        shell: python
        run: |
          import os
          import sys

          sys.path.insert(0, os.getcwd())
          from socratic_learn import __version__

          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/v"):
              expected = f"v{__version__}"
              actual = os.environ["GITHUB_REF_NAME"]
              if actual != expected:
                  raise SystemExit(
                      f"release tag {actual!r} does not match package {expected!r}"
                  )
          elif os.environ["GITHUB_EVENT_NAME"] != "workflow_dispatch":
              raise SystemExit(f"unsupported release ref: {ref}")

  python-package:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Build deterministic distribution
        run: python -m socratic_learn build
      - name: Run full unit suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate repository
        run: python tests/validate_repository.py
      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel --outdir release-dist
      - name: Validate exact artifacts
        shell: python
        run: |
          import os
          import pathlib
          import sys

          root = pathlib.Path.cwd()
          sys.path.insert(0, os.getcwd())
          from socratic_learn import __version__

          dist = root / "release-dist"
          expected = {
              dist / f"socratic_learn-{__version__}-py3-none-any.whl",
              dist / f"socratic_learn-{__version__}.tar.gz",
          }
          actual = {path for path in dist.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(
                  f"release artifacts mismatch: expected {sorted(expected)!r}, "
                  f"found {sorted(actual)!r}"
              )
      - name: Validate package metadata
        run: python -m twine check release-dist/*
      - name: Smoke test installed socratic read
        shell: python
        run: |
          import os
          import pathlib
          import sys

          root = pathlib.Path.cwd()
          sys.path.insert(0, os.getcwd())
          from socratic_learn import __version__

          # Gate: socratic read --agent pi minimal-text.pdf explain its evidence
          from tests.read_smoke import run_wheel_read_smoke

          wheel = root / "release-dist" / f"socratic_learn-{__version__}-py3-none-any.whl"
          run_wheel_read_smoke(root, wheel=wheel)
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: release-dist/*
          if-no-files-found: error

  npm-package:
    needs: python-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: false
      - name: Use npm trusted publishing floor
        run: npm install -g "npm@>=11.5.1"
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: release-dist
      - name: Install verified wheel for version checks
        run: python -m pip install release-dist/socratic_learn-*-py3-none-any.whl
      - name: Build @socraticlearn/cli from verified wheel
        run: |
          wheel="$(ls release-dist/socratic_learn-*-py3-none-any.whl)"
          python tools/build_npm_package.py "$wheel" --output-dir npm-dist
      - name: Run npm package tests
        run: npm test --prefix packages/npm-cli
      - name: Smoke packed tarball
        run: |
          tarball="$(ls npm-dist/*.tgz)"
          npx --yes --package "$tarball" socratic --version
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: npm-dist/*.tgz
          if-no-files-found: error

  publish-github:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - python-package
      - npm-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: release-assets/packages
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release-assets/npm
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release-assets/packages/*
          release-assets/npm/*
          --verify-tag
          --generate-notes

  publish-pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish-github
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: release-dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-dist/

  publish-npm:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish-github
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: false
      - name: Use npm trusted publishing floor
        run: npm install -g "npm@>=11.5.1"
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-dist
      - name: Publish @socraticlearn/cli to npm
        run: npm publish npm-dist/*.tgz --access public